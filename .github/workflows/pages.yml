# GitHub Pages 자동 배포.
# main 에 변경이 올라오면 저장소 전체를 Pages 로 배포합니다.
# configure-pages 의 enablement 옵션이 Pages 를 자동으로 켜주므로
# 저장소 Settings 화면에 들어가지 않아도 됩니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages 설정 (없으면 자동으로 켜기)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 사이트 파일 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
